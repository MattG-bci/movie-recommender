name: Deploy Prod

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy API to Railway (Prod)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Prod
        run: railway up --service api --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}

  migrate:
    name: Run Sqitch Migrations (Prod)
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-perl@v1
        with:
          perl-version: '5.38'

      - name: Install Sqitch and PostgreSQL driver
        run: |
          cpanm --notest App::Sqitch DBD::Pg

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
        run: |
          cd sqitch
          sqitch deploy "$DATABASE_URL"
