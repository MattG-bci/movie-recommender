name: Deploy Dev

on:
  push:
    branches-ignore:
      - master

jobs:
  deploy:
    name: Deploy API to Railway (Dev)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Dev
        run: railway up --service api-dev
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}

  migrate:
    name: Run Sqitch Migrations (Dev)
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - uses: actions/checkout@v4

      - name: Install Sqitch and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqitch libdbd-pg-perl

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
        run: |
          cd sqitch
          SQITCH_TARGET=$(echo "$DATABASE_URL" | sed 's|^postgresql://|db:pg://|')
          sqitch deploy "$SQITCH_TARGET"
