# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: movie-recommender
metadata:
    template: azd-init@1.37.2
services:
    movie-recommender:
        project: .
        host: containerapp
        language: python
        docker:
            path: Dockerfile
resources:
    movie-recommender:
        type: host.containerapp
        uses:
            - movie-recommender
        port: 8080
