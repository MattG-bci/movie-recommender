server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Prevent nginx from using absolute URLs (with internal port 80)
    # in redirects when the container port is mapped to a different host port.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
