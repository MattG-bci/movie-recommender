version: "3"
services:
  test-db:
    image: "postgres:16.3"
    command: "-c fsync=off"
    environment:
     - POSTGRES_USER=postgres
     - POSTGRES_PASSWORD=postgres
    ports:
     - "54320:5432"

  test-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - DB_HOST=test-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=test
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      # Exercise API ingestion against the in-stack site fixture rather than
      # an external Letterboxd host.
      - SCRAPER_BASE_URL=http://fake-site/
      - SCRAPER_USERNAME_PAGE=http://fake-site/members/popular/this/week/
      - SCRAPER_RATINGS_PAGE=http://fake-site/
      - SCRAPER_MOVIES_PAGE=http://fake-site/films/popular/
    ports:
      - "8090:8080"
    depends_on:
      - test-db
      - fake-site

  fake-site:
    image: "nginx:alpine"
    volumes:
      - ./fixtures/html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8089:80"
