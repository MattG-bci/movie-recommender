version: "3"
services:
  test-db:
    image: "postgres:16.3"
    command: "-c fsync=off"
    environment:
     - POSTGRES_USER=postgres
     - POSTGRES_PASSWORD=postgres
    ports:
     - "54320:5432"

  test-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - DB_HOST=test-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=test
    ports:
      - "8090:8080"
    depends_on:
      - test-db

  fake-site:
    image: "nginx:alpine"
    volumes:
      - ./fixtures/html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8089:80"
